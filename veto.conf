# Veto Configuration Example

[general]
listen_port=0
max_streams=4096
timeout_ms=30000
verbose=false

[profile:youtube]
enabled=true

  [strategy:youtube_fake]
  enabled=true
  type=fake
  fool=ttl
  fake_ttl=4
  hostlist=files/list-youtube.txt

  [strategy:youtube_split]
  enabled=true
  type=split
  split_pos=6
  hostlist=files/list-youtube.txt

